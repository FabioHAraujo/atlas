  @keyframes pop { 0% { opacity: 0; transform: scale(.55); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes wave { 0%,70%,100% { opacity: 1; } 35% { opacity: .78; } }
  @media (prefers-reduced-motion: reduce) { .t { animation: none; opacity: 1; } }
</style>
