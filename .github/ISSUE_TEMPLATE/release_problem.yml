name: Release or update problem
description: An install, an update, a channel switch or a downgrade did not work.
labels: ["type: bug", "area: installer", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for `install.sh`, `atlas update`, the Desktop updater, switching channels or a downgrade. How channels work: [Versioning and release channels](https://github.com/codeatlasdev/atlas/blob/main/docs/versioning.md).
        **Security problems do not go here**: use [private vulnerability reporting](https://github.com/codeatlasdev/atlas/security/advisories/new).
  - type: dropdown
    id: problem
    attributes:
      label: What went wrong?
      options:
        - The installer failed
        - '`atlas update` failed or stopped half way'
        - The Desktop updater failed
        - An update was offered that I did not expect
        - An update was not offered that I expected
        - Switching channel did not do what the docs say
        - A downgrade failed, or broke my settings
        - A checksum did not match
        - Other
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Channel you were on
      description: What `atlas update channel` printed before the problem.
      options:
        - stable
        - beta
        - alpha
        - not sure
    validations:
      required: true
  - type: dropdown
    id: target_channel
    attributes:
      label: Channel you wanted to move to
      description: Leave as "same channel" when you were just updating.
      options:
        - same channel
        - stable
        - beta
        - alpha
    validations:
      required: true
  - type: input
    id: from_version
    attributes:
      label: Version you were on (from)
      description: Output of `atlas version`, or "none" for a fresh install.
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: to_version
    attributes:
      label: Version you expected to get (to)
      placeholder: "1.4.0-beta.1"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What you ran and what it printed
      description: The command (`atlas update --check`, `atlas update channel beta`, the `curl ... | bash` line) and its full output. Redact secrets.
      render: shell
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and hardware
      placeholder: "macOS 15.1, Apple M3"
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: Current state
      description: Does `atlas version` still run? Does Atlas Desktop still open? Contents of `~/.atlas/update-channel` if you know it.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I tried again once and it failed the same way.
          required: true
        - label: I removed secrets and private data from everything I pasted.
          required: true
