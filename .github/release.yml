# Categories for GitHub's "Generate release notes" button (and `gh release create --generate-notes`).
# The notes of a published Atlas release come from CHANGELOG.md (see docs/release.md); this file only
# shapes the auto-generated list a maintainer may paste into that section. Labels: .github/labels.yml.
changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    - title: Breaking
      labels:
        - breaking change
    - title: Added
      labels:
        - "type: feature"
    - title: Fixed
      labels:
        - "type: bug"
        - "type: security"
    - title: Docs
      labels:
        - "type: docs"
    - title: Dependencies
      labels:
        - dependencies
    - title: Other
      labels:
        - "*"
